# nginx del contenedor web: único punto de entrada de la app.
# El proxy del servidor (con HTTPS) reenvía aquí; este reenvía /api a la API por la red interna.
# Así web y API comparten origen y la cookie SameSite=Strict funciona sin CORS.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Los formularios de la app son pequeños; nada de subir archivos.
    client_max_body_size 256k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Agrega la IP de quien nos llamó (el proxy del servidor) a la cadena; la API confía
        # solo en los saltos configurados en TRUST_PROXY_SALTOS.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Archivos con hash en el nombre (los genera Vite): se pueden cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cualquier otra ruta es de React Router: se entrega index.html, sin caché (para tomar versiones nuevas).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
